<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020502">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>PIP-BOY CALCULATION</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="calculadora">
        <section class="tela">
            <span class="titulo-tela">VAULT-TEC CALCULATION UNIT</span>
            <span class="status">SYSTEM READY</span>
            <div class="linha"></div>
            <span class="modo">MODE: ARITHMETIC</span>
            <p id="historico"></p>
            <p id="visor">0</p>
        </section>

        <button class="botao funcao" onclick="limpar()">AC</button>
        <button class="botao funcao" onclick="inverterSinal()">+/-</button>
        <button class="botao funcao" onclick="porcentagem()">%</button>
        <button class="botao operador" onclick="selecionarOperacao('/')">÷</button>

        <button class="botao" onclick="adicionarNumero('7')">7</button>
        <button class="botao" onclick="adicionarNumero('8')">8</button>
        <button class="botao" onclick="adicionarNumero('9')">9</button>
        <button class="botao operador" onclick="selecionarOperacao('*')">×</button>

        <button class="botao" onclick="adicionarNumero('4')">4</button>
        <button class="botao" onclick="adicionarNumero('5')">5</button>
        <button class="botao" onclick="adicionarNumero('6')">6</button>
        <button class="botao operador" onclick="selecionarOperacao('-')">-</button>

        <button class="botao" onclick="adicionarNumero('1')">1</button>
        <button class="botao" onclick="adicionarNumero('2')">2</button>
        <button class="botao" onclick="adicionarNumero('3')">3</button>
        <button class="botao operador" onclick="selecionarOperacao('+')">+</button>

        <button class="botao zero" onclick="adicionarNumero('0')">0</button>
        <button class="botao" onclick="adicionarDecimal()">,</button>
        <button class="botao operador" onclick="calcular()">=</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
