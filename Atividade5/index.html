<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="cabecalho">
            <p class="subtitulo">MINHAS TAREFAS</p>
            <h1>TO-DO LIST</h1>
            <p class="descricao">Organize seu dia, uma tarefa de cada vez.</p>
        </header>

        <div class="adicionar-tarefa">
            <input type="text" id="tarefa" placeholder="O que precisa ser feito?">
            <button id="adicionar">Adicionar</button>
        </div>

        <div class="folha">
            <div class="margem-folha"></div>

            <ul id="lista-tarefas">
            </ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
